<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Url Redirect - Rules</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<h1>Url Redirect</h1>
<p class="hint">Use <code>*</code> in "From" as a wildcard. In "To", use <code>$1</code>, <code>$2</code>... to insert what each <code>*</code> captured, in order.</p>

<table id="rulesTable">
  <thead>
    <tr>
      <th>On</th>
      <th>From</th>
      <th>To</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="rulesBody"></tbody>
</table>

<h2 id="formTitle">Add rule</h2>
<form id="ruleForm">
  <input type="hidden" id="ruleId">
  <label>From
    <input type="text" id="fromInput" placeholder="https://example.com/*" required>
  </label>
  <label>To
    <input type="text" id="toInput" placeholder="https://example-mirror.com/$1" required>
  </label>
  <div class="formButtons">
    <button type="submit" id="saveBtn">Save rule</button>
    <button type="button" id="cancelBtn" style="display:none;">Cancel edit</button>
  </div>
</form>

<script src="options.js"></script>
</body>
</html>
